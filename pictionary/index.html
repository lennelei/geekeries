<title>Pictionary – tireur de mots</title>
<style>
  /* Pensé pour l'e-ink : noir sur blanc, gros texte, aucune animation. */

  html, body { margin: 0; background: #fff; color: #000; }
  body { font-family: system-ui, sans-serif; min-height: 100vh; display: flex;
    flex-direction: column; justify-content: center; padding: 24px;
    max-width: 640px; margin: 0 auto; }
  ul { list-style: none; margin: 0 0 32px; padding: 0; }
  li { border-bottom: 2px solid #000; padding: 20px 0; }
  li:first-child { border-top: 2px solid #000; }
  .categorie { display: block; font-size: 18px; font-variant: small-caps;
    letter-spacing: 0.08em; margin-bottom: 4px; }
  .mot { display: block; font-size: 36px; font-weight: bold; }
  button { width: 100%; font: inherit; font-size: 28px; font-weight: bold;
    padding: 20px; background: #000; color: #fff; border: 0; border-radius: 8px; }
</style>
</head>
<body>
<ul id="mots" aria-live="polite"></ul>
<button id="autres" type="button">Autres mots</button>
<script id="logique">

function hasard(n, rng) {
  return Math.min(n - 1, Math.floor(rng() * n));
}

// Tire 3 mots de 3 catégories différentes, sans répéter un mot déjà vu
// tant que sa catégorie n'est pas épuisée. Ne modifie pas `vus`.
function tirer(mots, vus, rng = Math.random) {
  const categories = Object.keys(mots);
  for (let i = categories.length - 1; i > 0; i--) {
    const j = hasard(i + 1, rng);
    [categories[i], categories[j]] = [categories[j], categories[i]];
  }
  const nouveauxVus = {};
  for (const [c, liste] of Object.entries(vus)) nouveauxVus[c] = [...liste];
  const tirage = categories.slice(0, 3).map(categorie => {
    const dejaVus = new Set(nouveauxVus[categorie] || []);
    let candidats = mots[categorie].filter(m => !dejaVus.has(m));
    if (candidats.length === 0) {
      nouveauxVus[categorie] = [];
      candidats = mots[categorie];
    }
    const mot = candidats[hasard(candidats.length, rng)];
    nouveauxVus[categorie] = [...(nouveauxVus[categorie] || []), mot];
    return { categorie, mot };
  });
  return { tirage, vus: nouveauxVus };
}

function chargerVus(storage) {
  try {
    const brut = JSON.parse(storage.getItem(CLE_VUS));
    if (!brut || typeof brut !== 'object' || Array.isArray(brut)) return {};
    for (const v of Object.values(brut)) if (!Array.isArray(v)) return {};
    return brut;
  } catch {
    return {};
  }
}

function sauverVus(storage, vus) {
  try {
    storage.setItem(CLE_VUS, JSON.stringify(vus));
  } catch {
    // stockage indisponible : on joue sans mémoire
  }
}
</script>
<script>
const LIBELLES = { objet: 'Objet', animal: 'Animal', action: 'Action',
  personnage: 'Personnage', marque: 'Marque' };

// L'accès même à window.localStorage peut lever (fichier local, navigation privée).
let stockage;
try { stockage = window.localStorage; } catch { stockage = undefined; }
let vus = chargerVus(stockage);

function afficher(tirage) {
  const liste = document.getElementById('mots');
  liste.replaceChildren(...tirage.map(({ categorie, mot }) => {
    const li = document.createElement('li');
    const c = document.createElement('span');
    c.className = 'categorie';
    c.textContent = LIBELLES[categorie];
    const m = document.createElement('span');
    m.className = 'mot';
    m.textContent = mot;
    li.append(c, m);
    return li;
  }));
}

function nouveauTirage() {
  const r = tirer(MOTS, vus);
  vus = r.vus;
  sauverVus(stockage, vus);
  afficher(r.tirage);
}

document.getElementById('autres').addEventListener('click', nouveauTirage);
nouveauTirage();
</script>
